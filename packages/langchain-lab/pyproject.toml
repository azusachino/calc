[project]
name = "langchain-lab"
version = "0.1.0"
description = "Hands-on LangChain and agent-memory exercises for AI大模型系统实战"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
